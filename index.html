<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Manipulation</title>

    <style>
      .copyMe {
        display: inline-block;
        padding: 15px;
        border: 1px solid black;
        position: absolute;
        width: 60px;
        height: 40px;
        cursor: pointer;
        text-align: center;
      }

      .newb {
        color: red;
      }

      #garbage {
        position: absolute;
        height: 100px;
        width: 100px;
        background-color: black;
        left: 500px;
        top: 300px;
        color: white;
        line-height: 100px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="garbage">Garbage Bin</div>
    <div>Click to any button below</div>
    <div class="copyMe">Hello</div>
    <div class="copyMe">World</div>
    <div class="copyMe">TanTrinh</div>
    <div class="copyMe">Mastering</div>
    <div class="copyMe">Javascript</div>

    <script>
      const rep = document.querySelectorAll(".copyMe")
      const garbage = document.querySelector("#garbage")
      let holder = {}

      rep.forEach((ele, index) => {
        ele.addEventListener("click", function (e) {
          holder.obj = ele.cloneNode(true)
          holder.obj.style.cursor = "move"
          holder.obj.classList.add("newb")
          holder.obj.style.backgroundColor = randColor()
          holder.obj.style.left = ele.offsetLeft + "px"
          holder.obj.style.top = ele.offsetTop + 200 + "px"

          holder.obj.startX = ele.offsetLeft
          //   console.log("startX1: " + holder.obj.startX)
          holder.obj.startY = ele.offsetTop

          holder.obj.moves = Math.floor(Math.random() * 25)
          //   console.log(holder.obj.moves)

          holder.obj.int = setInterval(mover, 25)

          function mover() {
            if (holder.obj.moves <= 0) {
              clearInterval(holder.obj.int)
              //   console.log(holder.obj.style.left)
            } else {
              holder.obj.moves--

              holder.obj.startY += 10
              holder.obj.startX += 1
              //   console.log("startX2: " + holder.obj.startX)
              holder.obj.style.top = holder.obj.startY + "px"
              holder.obj.style.left = holder.obj.startX + "px"
            }
          }

          document.body.appendChild(holder.obj)
          //   console.log(holder.obj)

          drager(holder.obj)
        })

        ele.style.left = index * 100 + "px"
      })

      // (Draggable function)
      function drager(el) {
        let pos = {}
        el.onmousedown = dragMouse

        function dragMouse(e) {
          pos.nx = e.clientX
          pos.ny = e.clientY
          //   console.log(pos.nx, pos.ny)

          document.onmouseup = function () {
            document.onmouseup = null
            document.onmousemove = null
          }

          document.onmousemove = function (e) {
            pos.ox = pos.nx - e.clientX

            pos.oy = pos.ny - e.clientY

            pos.nx = e.clientX
            pos.ny = e.clientY

            if (isCollide(el)) {
              el.onmousedown = null
              el.parentElement.removeChild(el)
            }

            el.style.top = el.offsetTop - pos.oy + "px"
            el.style.left = el.offsetLeft - pos.ox + "px"
            // console.log(el.style.left)
          }
        }
      }

      function randColor() {
        function col() {
          let hex = Math.floor(Math.random() * 256).toString(16)

          return ("0" + String(hex)).substr(-2)
        }

        return "#" + col() + col() + col()
      }

      function isCollide(a) {
        let aRect = a.getBoundingClientRect()
        let bRect = garbage.getBoundingClientRect()

        return !(
          aRect.bottom < bRect.top ||
          aRect.top > bRect.bottom ||
          aRect.left > bRect.right ||
          aRect.right < bRect.left
        )
      }
    </script>
  </body>
</html>
